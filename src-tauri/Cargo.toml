[package]
name = "pi-app"
version = "1.0.3"
description = "A desktop workbench for the Pi coding agent with graphical controls and a full terminal interface"
authors = ["nbang2026"]
license = "MIT"
repository = "https://github.com/nbang2026/Easy_pi"
edition = "2021"

[lib]
name = "pi_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
getrandom = "0.3"
