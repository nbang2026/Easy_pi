name: Desktop validation (unsigned candidates)

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          architecture: ${{ runner.os == 'macOS' && 'arm64' || 'x64' }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-windows-runtime.mjs
      - name: macOS checks
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm install --global @earendil-works/pi-coding-agent@1.3.0
          PI_GUI_SMOKE_EXECUTABLE="$(command -v pi)" PI_GUI_SMOKE_NODE="$(command -v node)" PI_GUI_SMOKE_PATH="$PATH" pnpm verify
      - name: macOS candidate
        if: runner.os == 'macOS'
        run: pnpm exec tauri build --bundles app,dmg
      - name: Windows checks and installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-desktop-windows.ps1 -VerifyInstallers
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ runner.os }}
          if-no-files-found: warn
          path: verification-report.json
      - name: Save unsigned candidates
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-candidate-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
